# 9rayaverse — Nginx site (installed by deploy/install.sh; __PLACEHOLDERS__ are filled in)
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root __APP_DIR__;
    index index.html;
    client_max_body_size 26m;

    # ---- Private files (Apache used .htaccess for this) ----
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(ws-server|deploy)/ { deny all; }
    location ~ ^/uploads/(courses|proofs)/ { deny all; }
    location ~ ^/uploads/.*\.(php|phtml|phar|html?)$ { deny all; }
    location ~ \.(sql|md|lock|sh|example|conf|service)$ { deny all; }
    location = /config.php { deny all; }
    location = /config.example.php { deny all; }
    location = /api/_bootstrap.php { deny all; }

    # ---- Real-time server (Node.js) through the same HTTPS connection ----
    location = /ws {
        proxy_pass http://127.0.0.1:__WS_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ---- PHP API ----
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php__PHPV__-fpm.sock;
    }

    # ---- App (PWA) ----
    location = /manifest.webmanifest { default_type application/manifest+json; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location ~* \.(css|js|png|jpe?g|webp|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location / { try_files $uri $uri/ =404; }
}
